name: Validate examples

# Validate examples against this repository's schema first. The pinned action
# separately checks them against the Kinetic Gain Protocol Suite's bundled
# schemas; it does not validate edits to aeo.schema.json in this repository.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-examples:
    name: Validate local and Protocol Suite schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: mizcausevic-dev/kg-validate-action@88ec89cd265205cc0a0e58d13d3fa93a5ca18898 # v0.1.0
        with:
          files: 'examples/**/*.json'

# Least-privilege: read-only test/CI runs. GITHUB_TOKEN gets no write to
# anything. The publish/release flows (where they exist) carry their own
# scoped permissions per-workflow.
permissions:
  contents: read
